# Template for Fly.io. Change `app` to a unique name. Secrets are NOT stored here (see docs/DEPLOYMENT.md).
app = "stonic-website"
primary_region = "fra"

[build]
  [build.args]
    NEXT_PUBLIC_SITE_URL = "https://YOUR-DOMAIN"   # replace with the real https origin before deploying
    APP_ENV = "production"

[env]
  APP_ENV = "production"
  NEXT_PUBLIC_SITE_URL = "https://YOUR-DOMAIN"
  DATA_DIR = "/data"

[mounts]
  source = "stonic_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1   # keep ONE instance: the login rate limiter is in-memory and data is on one volume

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
