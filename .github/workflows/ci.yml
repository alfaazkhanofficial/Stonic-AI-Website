name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          APP_ENV: preview
          NEXT_PUBLIC_SITE_URL: https://preview.invalid
      - name: Static (free hosting) build
        run: npm run build:static
        env:
          NEXT_PUBLIC_SITE_URL: https://preview.invalid
          APP_ENV: preview
      - name: Dependency vulnerability check
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=https://example.invalid -t stonic-website:ci .
